# Started by ./start.sh — use that instead of running compose directly.
services:
  turtlebot-sim:
    build: .
    image: turtlebot-oro
    container_name: turtlebot_sim
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      # X11 socket, so RViz can open a window (start.sh runs `xhost +local:docker`)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # This repo: launch files, scripts, RViz config
      - .:/turtlebot-oro
    devices:
      # Intel GPU, for hardware-accelerated RViz
      - /dev/dri:/dev/dri
    network_mode: host
    ipc: host
    # GAZEBO=true (start.sh -g) runs the Gazebo robot instead of the fake one
    # MAP=true (start.sh -map) serves the Monopoly map
    # SLAM=true (start.sh -slam) builds the map live
    # REAL=true (start.sh -r) drives a real TurtleBot3 on the same network instead
    command: ["ros2", "launch", "/turtlebot-oro/launch/demo.launch.py",
              "gazebo:=${GAZEBO:-false}", "map:=${MAP:-false}", "slam:=${SLAM:-false}", "real:=${REAL:-false}"]

  # ROS2 InOrbit agent. Needs agent/agent.env.sh (copy agent/agent.env.sh.example).
  # start.sh enables the "agent" profile only when that file exists.
  agent:
    image: inorbitai/agent:ros-jazzy-4.36.0
    container_name: turtlebot_agent
    profiles: ["agent"]
    hostname: turtlebot
    restart: always
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # Gazebo stamps TF with its own clock: the agent must follow it, or poses never resolve
      - USE_SIM_TIME=${GAZEBO:-false}
    volumes:
      - ./local:/root/.inorbit/local/
      - ./agent/agent.env.sh:/root/.inorbit/local/agent.env.sh
      # Scripts behind ORO's RunScript actions, and the repo they call into
      - ./agent/user_scripts:/root/.inorbit/local/user_scripts
      - .:/turtlebot-oro:ro

  # Tail agent logs from a separate container: docker compose logs -f agent-logs
  agent-logs:
    image: busybox
    container_name: turtlebot_agent_logs
    profiles: ["agent"]
    depends_on: [agent]
    volumes:
      - ./local:/logs:ro
    command: ["sh", "-c", "until [ -f /logs/inorbit_agent.log ]; do sleep 1; done; tail -F /logs/inorbit_agent.log"]
