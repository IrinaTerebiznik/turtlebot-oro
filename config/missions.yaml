# Missions for the "Start mission" action: waypoints [x, y] (m) driven in order,
# optional yaw (rad) on the last one. Frame "map".
# Tuned for Gazebo's turtlebot3_world (start.sh -g [-slam]): map = where the robot spawned,
# facing the 3x3 pillar grid. Pillars sit at x 0.9 / 2.0 / 3.1, y -0.6 / 0.5 / 1.6;
# the routes run through the lanes between them. Redo these for a real floor.
frame: map
missions:
  "1":
    label: Out and back
    waypoints:
      - [1.45, -0.05]
      - [0.0, 0.0, 0.0]
  "2":
    label: Loop around a pillar
    waypoints:
      - [0.4, -0.05]
      - [1.45, -0.05]
      - [1.45, 1.05]
      - [0.4, 1.05]
      - [0.0, 0.0, 0.0]
  "3":
    label: Long lane
    waypoints:
      - [2.55, -0.05]
      - [0.0, 0.0, 0.0]
